name: Generate Animated ASCII Profile Card & Pacman Graph

on:
  schedule:
    # Runs automatically once every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'assets/*.svg'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pip install pillow requests numpy

      - name: Generate animated ASCII profile card
        env:
          GITHUB_LOGIN: imLocutor
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_PATH: assets/profile.svg
        run: python scripts/generate_card.py

      - name: Generate Pac-Man contribution graph
        run: |
          npx --yes pacman-contribution-graph --game pacman --username imLocutor --platform github --gameTheme github-dark --output assets/pacman-contribution-graph-dark.svg
          npx --yes pacman-contribution-graph --game pacman --username imLocutor --platform github --gameTheme github --output assets/pacman-contribution-graph.svg

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg assets/pacman-contribution-graph-dark.svg assets/pacman-contribution-graph.svg
          git diff --staged --quiet || git commit -m "chore(profile): refresh dynamic cards [skip ci]"
          git push
